{% extends "base.html" %}
{% block title %}Новый пароль{% endblock %}
{% block content %}
{% if validlink %}
  <h1>Новый пароль</h1>
  <form method="post" class="form-narrow">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Сохранить пароль</button>
  </form>
{% else %}
  <h1>Ссылка недействительна</h1>
  <p class="lead prose">Ссылка устарела или уже использована.
    <a href="{% url 'accounts:password_reset' %}">Запросите новую</a>.</p>
{% endif %}
{% endblock %}
