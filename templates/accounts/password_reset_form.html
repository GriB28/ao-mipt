{% extends "base.html" %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
<h1>Восстановление пароля</h1>
<p class="lead prose">Укажите почту, с которой вы регистрировались — пришлём ссылку для смены пароля.</p>
<form method="post" class="form-narrow">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn" type="submit">Отправить ссылку</button>
</form>
{% endblock %}
