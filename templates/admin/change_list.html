{% extends "admin/change_list.html" %}
{% load static %}

{% block extrahead %}
  {{ block.super }}
  <script src="{% static 'js/admin_ajax_editable.js' %}" defer></script>
  <style>
    /* Скрываем кнопку "Сохранить" в таблице со списком */
    #changelist-form input[type="submit"][name="_save"],
    #changelist-form .paginator input[type="submit"][name="_save"],
    #changelist-form .submit-row {
      display: none !important;
    }

    /* Индикатор автоматического сохранения в админке */
    .admin-ajax-indicator {
      position: fixed;
      top: 18px;
      right: 28px;
      z-index: 99999;
      padding: 7px 15px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      transition: opacity 0.25s ease, transform 0.25s ease;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .admin-ajax-indicator.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .admin-ajax-indicator.success {
      background-color: #059669;
      color: #ffffff;
    }
    .admin-ajax-indicator.loading {
      background-color: #2563eb;
      color: #ffffff;
    }
    .admin-ajax-indicator.error {
      background-color: #dc2626;
      color: #ffffff;
    }

    /* Анимация подсветки сохранённой строки */
    tr.ajax-saved td {
      animation: adminRowFlash 1.2s ease;
    }
    @keyframes adminRowFlash {
      0% { background-color: rgba(5, 150, 105, 0.25) !important; }
      100% { background-color: transparent; }
    }
  </style>
{% endblock %}
