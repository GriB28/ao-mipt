server {
    listen 80;
    server_name _;

    # Лимит должен совпадать с MAX_UPLOAD_SIZE_MB в .env,
    # иначе nginx отрежет файл раньше, чем Django выдаст понятную ошибку.
    client_max_body_size 20M;

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        # Решения участников не должны исполняться в домене сайта:
        # отдаём их только как вложения.
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
