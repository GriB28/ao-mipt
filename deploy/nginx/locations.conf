# Общая часть для http- и https-конфигурации: что куда отдаётся.

# Работы участников по прямому адресу не отдаём никому. Их выдаёт
# Django после проверки прав (contest:submission_file) через
# X-Accel-Redirect на /protected-media/ ниже.
location /media/solutions/ {
    return 404;
}

# Остальные загрузки публичные: условия задач, фото финалов, обложки.
location /media/ {
    alias /var/www/media/;
    expires 7d;
    # Файлы загружают люди: не даём браузеру исполнять их в домене сайта,
    # отдаём только как вложения.
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Сюда попадает только внутренний редирект от Django, снаружи недоступно.
location /protected-media/ {
    internal;
    alias /var/www/media/;
    # Content-Disposition (открыть или скачать) приходит от Django.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "private, no-store" always;
}

location / {
    proxy_pass http://web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    # Большой скан с мобильного интернета в последний час перед дедлайном
    # грузится долго: nginx принимает файл целиком и только потом
    # передаёт в Django, поэтому gunicorn не ждёт медленных клиентов.
    proxy_read_timeout 120s;
}
