# Общая часть для http- и https-конфигурации: что куда отдаётся.

# Работы участников по прямому адресу не отдаём никому. Их выдаёт
# Django после проверки прав (contest:submission_file) через
# X-Accel-Redirect на /protected-media/ ниже.
location /media/solutions/ {
    return 404;
}

# Остальные загрузки публичные: условия задач, фото финалов, обложки.
location /media/ {
    alias /var/www/media/;
    expires 7d;
    # Файлы загружают люди: не даём браузеру исполнять их в домене сайта,
    # отдаём только как вложения.
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Сюда попадает только внутренний редирект от Django, снаружи недоступно.
location /protected-media/ {
    internal;
    alias /var/www/media/;
    # Content-Disposition (открыть или скачать) приходит от Django.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "private, no-store" always;
}

# Вход, регистрация, сброс пароля, админка: ограничиваем частоту
# запросов с одного адреса — против перебора паролей и рассылки писем
# со сбросом пароля на чужие ящики. Запас большой: на площадке весь
# класс регистрируется с одного школьного IP.
location ~ ^/(accounts/(login|signup|password-reset|confirm/resend)|admin/login)/ {
    limit_req zone=auth burst=30 nodelay;
    include /etc/nginx/olymp/proxy.conf;
}

location / {
    include /etc/nginx/olymp/proxy.conf;
}
