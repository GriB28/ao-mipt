# Передача запроса в Django (gunicorn). Подключается из locations.conf.
proxy_pass http://web:8000;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_redirect off;
# Большой скан с мобильного интернета в последний час перед дедлайном
# грузится долго: nginx принимает файл целиком и только потом
# передаёт в Django, поэтому gunicorn не ждёт медленных клиентов.
proxy_read_timeout 120s;
