# Сайт олимпиады целиком: база, приложение, nginx с HTTPS, продление
# сертификата, рассылки и ежедневный бэкап. Всё поднимается одной
# командой `docker compose up -d --build`, crontab на сервере не нужен.
#
# Настройки — в .env (образец: .env.example). Порядок развёртывания —
# docs/deploy.md.

name: asolymp

x-app: &app
  build: .
  image: olymp-web
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-olymp}:${POSTGRES_PASSWORD:?впишите POSTGRES_PASSWORD в .env}@db:5432/${POSTGRES_DB:-olymp}
    MEDIA_ROOT: /app/media
    # Файлы решений отдаёт nginx после проверки прав в Django.
    PROTECTED_MEDIA_ACCEL_PREFIX: /protected-media/
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olymp}
      POSTGRES_USER: ${POSTGRES_USER:-olymp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?впишите POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olymp} -d ${POSTGRES_DB:-olymp}"]
      interval: 5s
      retries: 10
    # Даём базе спокойно дописать всё на диск при остановке, а не
    # обрывать её через 10 секунд по умолчанию.
    stop_grace_period: 1m
    restart: unless-stopped
    logging: *logging

  web:
    <<: *app
    command: ["web"]
    healthcheck:
      test: ["CMD", "python", "deploy/healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Очередь рассылок: раз в минуту отправляет порцию писем.
  mailer:
    <<: *app
    command: ["mailer"]
    depends_on:
      web:
        condition: service_healthy

  # к нджинксу нужно настроить конфиг в глобале
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8888:80"
    environment:
      DOMAIN: ${DOMAIN:-}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-100m}
    volumes:
      - ./deploy/nginx/40-olymp-config.sh:/docker-entrypoint.d/40-olymp-config.sh:ro
      - ./deploy/nginx:/etc/nginx/olymp:ro
      - media:/var/www/media:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - web
    restart: unless-stopped
    logging: *logging

  # Продлевает сертификат Let's Encrypt (проверка дважды в сутки,
  # реально продлевает за 30 дней до конца). Первый выпуск — make https.

  # фигня это всё, а не сертбот. у нас ревёрс прокси будет и продление сертификатов должно глобально хэндлиться
  # certbot:
  #   image: certbot/certbot
  #   entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
  #   volumes:
  #     - letsencrypt:/etc/letsencrypt
  #     - certbot-www:/var/www/certbot
  #   restart: unless-stopped
  #   logging: *logging

  # Ежедневный бэкап базы и загрузок в ./backups (см. deploy/backup.sh).
  backup:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olymp}
      POSTGRES_USER: ${POSTGRES_USER:-olymp}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-00}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - media:/media:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  media:
  letsencrypt:
  certbot-www:
